# shellcheck shell=sh
# sci reads the first config it finds — $CI_CONF, ./ci/simple-ci.conf,
# ~/.config/simple-ci.conf, <sci-dir>/simple-ci.conf — and does not merge them,
# so this one pulls in the machine's host settings itself. Real host names stay
# out of the repo.
# shellcheck source=/dev/null
if [ -f "$HOME/.config/simple-ci.conf" ]; then
    . "$HOME/.config/simple-ci.conf"
else
    echo "ci/simple-ci.conf: no ~/.config/simple-ci.conf; set CI_SERVER_URL and CI_REMOTE_SCRIPT there" >&2
fi

CI_HOST=gpu
