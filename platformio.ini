; rtl433-web-receiver - rtl_433_ESP with WiFi and a live signal page
;
; Copy .env.example to .env and fill in your credentials before building.
; .env is gitignored; load_env.py turns its entries into -D build flags.

[platformio]
default_envs = esp32s3-generic
src_dir = .

[libraries]
arduinolog = https://github.com/1technophile/Arduino-Log.git#d13cd80
arduinojson = ArduinoJson
rtl_433_ESP = https://github.com/jbroll/rtl_433_ESP.git#sx1231-support  ; Builds library from source directory

[env]
framework = arduino
platform = espressif32@6.1.0
monitor_filters = esp32_exception_decoder
monitor_speed = 921600
lib_ldf_mode = chain+
lib_deps =
	${libraries.arduinolog}
	${libraries.arduinojson}
	${libraries.rtl_433_ESP}

[env:esp32s3-generic]
platform = espressif32@6.1.0
platform_packages =
  framework-arduinoespressif32 @ ~3.20007.0
board = esp32s3box
framework = arduino
extra_scripts = pre:load_env.py

build_flags =
    -D LED_BUILTIN=2
    -D ARDUINO_ESP32S3_DEV
  '-DLOG_LEVEL=LOG_LEVEL_NOTICE'
  '-DONBOARD_LED=LED_BUILTIN'
; *** rtl_433_ESP Options ***
  '-DRF_MODULE_FREQUENCY=433.92'   ; 433MHz ISM band
  '-DOOK_MODULATION=1'             ; False = FSK, True = OOK
  '-DRF_RF69="RF69"'               ; RFM69 / RF69 family transceiver
  '-DMINIMUM_SIGNAL_DURATION=30000' ; one Acurite 592TXR packet is 39.1ms
  '-DOOK_FIXED_THRESHOLD=0x50'     ; OOK threshold for SX1231
;  '-DFAKE_SIGNALS=true'           ; inject a synthetic decode every 3s
; *** RF Module Pin Mapping for ESP32-S3-CAM ***
  '-DRF_MODULE_MISO=1'      ; SPI MISO
  '-DRF_MODULE_MOSI=42'     ; SPI MOSI
  '-DRF_MODULE_SCK=41'      ; SPI SCK
  '-DRF_MODULE_CS=40'       ; SX1231 NSS/CS
  '-DRF_MODULE_RST=39'      ; RFM69 RESET pin
  '-DRF_MODULE_DIO0=38'     ; SX1231 DIO0 (IRQ)
  '-DRF_MODULE_DIO1=47'     ; SX1231 DIO1 (optional IRQ)
  '-DRF_MODULE_DIO2=21'     ; SX1231 DIO2 (continuous data output)
  '-DRF_MODULE_INIT_STATUS=true'
; *** RadioLib Options ***
  '-DRADIOLIB_GODMODE'
