; Throwaway radio diagnostic. Its own project so receiver/'s src_filter never
; sees it and it never shares a build directory with the firmware.

[platformio]
default_envs = probe
src_dir = .

[env:probe]
platform = espressif32@6.1.0
platform_packages =
  framework-arduinoespressif32 @ ~3.20007.0
board = esp32s3box
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -D ARDUINO_ESP32S3_DEV
