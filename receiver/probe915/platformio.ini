; Throwaway 915 MHz scans: rtl_433_ESP only, no WiFi and no web UI, so a decode
; failure is the radio's and not the firmware's. Its own project so receiver/'s
; src_filter never sees it. The pin map came from receiver/probe.
;
; One radio hears one channel, one modulation and one bitrate at a time, so
; each hypothesis about what is out there is a separate environment rather than
; a setting. [radio] holds what they all share.

[platformio]
default_envs = scan915
src_dir = .

[libraries]
arduinolog = https://github.com/1technophile/Arduino-Log.git#d13cd80
arduinojson = ArduinoJson
; lib/rtl_433_ESP is a copy of the pinned library with one patch: an #ifndef
; around MINIMUM_PULSE_LENGTH, which upstream defines unconditionally so no
; build flag can lower the OOK capture floor. lib/ is gitignored; recreate it
; with
;   cp -r ../.pio/libdeps/rfm69-433/rtl_433_ESP lib/
; and re-apply that guard.

[radio]
; RESET, DIO0 and DIO1 are not wired on this board; a probe sweep of every free
; GPIO found nothing that resets the part and nothing but DIO2 that moves.
flags =
    -D ARDUINO_ESP32S3_DEV
  '-DLOG_LEVEL=LOG_LEVEL_VERBOSE'
  '-DRF_SX1276="SX1276"'
; 0x50 is the SX1231's threshold; on an SX127x RegOokFix is the peak-mode floor
; in dB and 0x50 leaves the part deaf. RadioLib's own default is 0x0C.
  '-DOOK_FIXED_THRESHOLD=0x0C'
  '-DPUBLISH_UNPARSED=true'
; pulse_analyzer() runs on every burst no decoder claimed: pulse-width
; histogram, estimated bitrate, guessed modulation, raw bits.
  '-DRTL_ANALYZER=true'
  '-DRF_MODULE_MISO=1'
  '-DRF_MODULE_MOSI=42'
  '-DRF_MODULE_SCK=41'
  '-DRF_MODULE_CS=40'
  '-DRF_MODULE_RST=RADIOLIB_NC'
  '-DRF_MODULE_DIO0=RADIOLIB_NC'
  '-DRF_MODULE_DIO1=RADIOLIB_NC'
  '-DRF_MODULE_DIO2=38'
  '-DRF_MODULE_INIT_STATUS=true'
  '-DRADIOLIB_GODMODE'

[env]
platform = espressif32@6.1.0
platform_packages =
  framework-arduinoespressif32 @ ~3.20007.0
board = esp32s3box
framework = arduino
lib_ldf_mode = chain+
monitor_speed = 115200
upload_speed = 921600
; src_dir is "." so lib/ would otherwise be compiled as project source as well
; as linked as a library, and its examples have their own main().
src_filter = +<*> -<lib> -<.pio>
lib_deps =
	${libraries.arduinolog}
	${libraries.arduinojson}

; 915.00 OOK. The band's weather-sensor catalogue sits here.
[env:scan915]
build_flags =
    ${radio.flags}
  '-DRF_MODULE_FREQUENCY=915.00'
  '-DOOK_MODULATION=1'
  '-DMINIMUM_SIGNAL_DURATION=30000'

; The same channel in FSK. RegOpMode's ModulationType field is not a mask, so
; this cannot run alongside scan915.
[env:scan915fsk]
build_flags =
    ${radio.flags}
  '-DRF_MODULE_FREQUENCY=915.00'
  '-DOOK_MODULATION=0'
  '-DMINIMUM_SIGNAL_DURATION=30000'

; US utility smart meters (Itron ERT SCM+ and IDM) transmit at 912.6 MHz, not
; 915: scmplus.c and ert_idm.c both record "Freq 912600155". They are OOK
; Manchester at short_width 30us, and a packet runs a few milliseconds. The
; 915/30ms settings above could never have heard one -- off channel by ten RX
; bandwidths, and MINIMUM_SIGNAL_DURATION discarded anything that short.
[env:scan912ert]
build_flags =
    ${radio.flags}
  '-DRF_MODULE_FREQUENCY=912.60'
  '-DOOK_MODULATION=1'
  '-DMINIMUM_SIGNAL_DURATION=2000'

; Sampling resolution sweep. Every burst captured so far best-fits a 65us grid
; regardless of band or modulation, which is MINIMUM_PULSE_LENGTH's 50us floor
; plus ISR latency rather than any transmitter's symbol rate. These three vary
; only that filter. If the best-fit grid tracks the filter, the capture is
; still reporting itself; if a burst holds its own base period as the filter
; drops, that period is the signal's.
[scan915p]
flags =
    ${radio.flags}
  '-DRF_MODULE_FREQUENCY=915.00'
  '-DOOK_MODULATION=1'
  '-DMINIMUM_SIGNAL_DURATION=2000'

[env:scan915p50]
build_flags = ${scan915p.flags} '-DMINIMUM_PULSE_LENGTH=50'

[env:scan915p20]
build_flags = ${scan915p.flags} '-DMINIMUM_PULSE_LENGTH=20'

[env:scan915p12]
build_flags = ${scan915p.flags} '-DMINIMUM_PULSE_LENGTH=12'
