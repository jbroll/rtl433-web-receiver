; rtl433-web-receiver - rtl_433_ESP with WiFi and a live signal page
;
; WiFi credentials no longer need to be baked in: a device with none opens a
; SoftAP captive portal to collect them (see receiver/docs/install.md).
; Copying .env.example to .env is an optional dev/CI shortcut instead;
; .env is gitignored, and load_env.py turns its entries into -D build flags.

[platformio]
default_envs = esp32s3-generic
src_dir = .

[libraries]
arduinolog = https://github.com/1technophile/Arduino-Log.git#d13cd80
arduinojson = ArduinoJson
pubsubclient = PubSubClient
rtl_433_ESP = https://github.com/jbroll/rtl_433_ESP.git#61170ad6081ed394ac1c5aaef6919fb8788e8448  ; Builds library from source directory
adafruit_bmp280 = Adafruit BMP280 Library

[env]
framework = arduino
platform = espressif32@6.1.0
monitor_filters = esp32_exception_decoder
monitor_speed = 921600
lib_ldf_mode = chain+
; src_dir is "." so the host tests under test/ would otherwise be compiled
; into the firmware image (and their main() would conflict). probe/ is the
; throwaway radio diagnostic sketch, built as its own project. .pio is
; PlatformIO's own build-output directory, which a sibling PlatformIO project
; or a stray local build can leave under receiver/.
src_filter = +<*> -<test> -<probe*> -<.pio>
lib_deps =
	${libraries.arduinolog}
	${libraries.arduinojson}
	${libraries.pubsubclient}
	${libraries.rtl_433_ESP}
	${libraries.adafruit_bmp280}

[env:esp32s3-generic]
platform = espressif32@6.1.0
platform_packages =
  framework-arduinoespressif32 @ ~3.20007.0
board = esp32s3box
framework = arduino
board_build.partitions = partitions.csv
extra_scripts = pre:load_env.py
                pre:build_dashboard.py

build_flags =
    -D LED_BUILTIN=2
    -D ARDUINO_ESP32S3_DEV
  '-DLOG_LEVEL=LOG_LEVEL_NOTICE'
  '-DONBOARD_LED=LED_BUILTIN'
; *** rtl_433_ESP Options ***
  '-DRF_MODULE_FREQUENCY=433.92'   ; 433MHz ISM band
  '-DOOK_MODULATION=1'             ; False = FSK, True = OOK
  '-DRF_RF69="RF69"'               ; RFM69 / RF69 family transceiver
  '-DMINIMUM_SIGNAL_DURATION=30000' ; one Acurite 592TXR packet is 39.1ms
  '-DDEVICE_STALE_HOURS=72'        ; free a slot unheard this long; 0 disables
  '-DSILENT_MS=180000'              ; no decode this long: the silent window
  '-DNOISE_FLOOR_DBM=-120'          ; averageRssi at/below this: the parked signature
  '-DRECOVERY_BACKOFF_MS=120000'    ; suppress a re-trigger this long after a soft re-init
  '-DMQTT_MAX_PACKET_SIZE=2200'     ; big enough for SIGNAL_PAYLOAD_MAX (600) + topic, and for a full LAYOUT_STORE_MAX (2048) $layout blob + topic
  '-DMQTT_RECONNECT_BACKOFF_MS=30000' ; minimum gap between MQTT reconnect attempts
  '-DOOK_FIXED_THRESHOLD=0x50'     ; OOK threshold for SX1231
;  '-DFAKE_SIGNALS=true'           ; inject a synthetic decode every 3s
;  '-DFAKE_RADIO_FAIL_MS=300000'    ; FAKE_SIGNALS: pretend the radio is deaf after this long
; *** RF Module Pin Mapping for Freenove ESP32-S3-WROOM CAM carrier ***
; MISO/MOSI/SCK are SPI; DIO2 is the continuous-data output the decoder reads.
; DIO0 and DIO1 are not used by rtl_433_ESP for RF69; pass RADIOLIB_NC so
; RadioLib does not touch those pins.
  '-DRF_MODULE_MISO=1'               ; SPI MISO
  '-DRF_MODULE_MOSI=42'              ; SPI MOSI
  '-DRF_MODULE_SCK=41'               ; SPI SCK
  '-DRF_MODULE_CS=39'                ; SX1231 NSS/CS
  '-DRF_MODULE_RST=38'               ; RFM69 RESET pin
  '-DRF_MODULE_DIO0=RADIOLIB_NC'     ; unused for RF69 continuous-data mode
  '-DRF_MODULE_DIO1=RADIOLIB_NC'     ; unused for RF69 continuous-data mode
  '-DRF_MODULE_DIO2=40'              ; SX1231 DIO2 (continuous data output)
  '-DRF_MODULE_INIT_STATUS=true'
; *** RadioLib Options ***
  '-DRADIOLIB_GODMODE'
