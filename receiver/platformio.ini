; rtl433-web-receiver - rtl_433_ESP with WiFi and a live signal page
;
; WiFi credentials no longer need to be baked in: a device with none opens a
; SoftAP captive portal to collect them (see receiver/docs/install.md).
; Copying .env.example to .env is an optional dev/CI shortcut instead;
; .env is gitignored, and load_env.py turns its entries into -D build flags.

[platformio]
default_envs = rfm69-433
src_dir = .

[libraries]
arduinolog = https://github.com/1technophile/Arduino-Log.git#d13cd80
arduinojson = ArduinoJson
pubsubclient = PubSubClient
rtl_433_ESP = https://github.com/jbroll/rtl_433_ESP.git#61170ad6081ed394ac1c5aaef6919fb8788e8448  ; Builds library from source directory
adafruit_bmp280 = Adafruit BMP280 Library

[env]
framework = arduino
platform = espressif32@6.1.0
monitor_filters = esp32_exception_decoder
monitor_speed = 921600
lib_ldf_mode = chain+
; src_dir is "." so the host tests under test/ would otherwise be compiled
; into the firmware image (and their main() would conflict). probe/ and
; probe915/ are throwaway radio diagnostic sketches, built as their own
; projects. .pio is PlatformIO's own build-output directory, which a sibling
; PlatformIO project or a stray local build can leave under receiver/.
src_filter = +<*> -<test> -<probe*> -<.pio>
lib_deps =
	${libraries.arduinolog}
	${libraries.arduinojson}
	${libraries.pubsubclient}
	${libraries.rtl_433_ESP}
	${libraries.adafruit_bmp280}

; Everything both boards share. Only the radio flags below differ, so a change
; to a store limit or an MQTT buffer lands on both without being copied.
[common]
board_flags =
    -D LED_BUILTIN=2
    -D ARDUINO_ESP32S3_DEV
  '-DLOG_LEVEL=LOG_LEVEL_NOTICE'
  '-DONBOARD_LED=LED_BUILTIN'
  '-DOOK_MODULATION=1'             ; False = FSK, True = OOK
  '-DMINIMUM_SIGNAL_DURATION=30000' ; one Acurite 592TXR packet is 39.1ms
  '-DDEVICE_STALE_HOURS=72'        ; free a slot unheard this long; 0 disables
  '-DSILENT_MS=180000'              ; no decode this long: the silent window
  '-DNOISE_FLOOR_DBM=-120'          ; averageRssi at/below this: the parked signature
  '-DRECOVERY_BACKOFF_MS=120000'    ; suppress a re-trigger this long after a soft re-init
  '-DMQTT_MAX_PACKET_SIZE=5300'     ; big enough for SIGNAL_PAYLOAD_MAX (600) + topic, and for a full LAYOUT_STORE_MAX (5120) $layout blob + topic; PubSubClient allocates this buffer permanently per connected broker, up to four (MQTT_PUBLISH_SLOTS + the build-flag default) at once, so raising it from 768 costs heap for the life of each connection, not just a message-size cap
  '-DMQTT_RECONNECT_BACKOFF_MS=30000' ; minimum gap between MQTT reconnect attempts
  '-DARDUINOJSON_POOL_CAPACITY=16'  ; a 16-slot (256-byte) pool chunk, so the fixed record() arena grows in steps close to what a message needs instead of the 128-slot default's 2KB upfront chunk
;  '-DFAKE_SIGNALS=true'           ; inject a synthetic decode every 3s
;  '-DFAKE_RADIO_FAIL_MS=300000'    ; FAKE_SIGNALS: pretend the radio is deaf after this long
; *** RadioLib Options ***
  '-DRADIOLIB_GODMODE'

[esp32s3]
platform = espressif32@6.1.0
platform_packages =
  framework-arduinoespressif32 @ ~3.20007.0
board = esp32s3box
framework = arduino
board_build.partitions = partitions.csv
extra_scripts = pre:load_env.py
                pre:build_dashboard.py
                post:tools/save_elf.py

; The 433 MHz board: Freenove ESP32-S3-WROOM CAM on the rtl433-carrier PCB with
; a HopeRF RFM69CW (SX1231). This is the deployed receiver.
[env:rfm69-433]
platform = ${esp32s3.platform}
platform_packages = ${esp32s3.platform_packages}
board = ${esp32s3.board}
framework = ${esp32s3.framework}
board_build.partitions = ${esp32s3.board_build.partitions}
extra_scripts = ${esp32s3.extra_scripts}

build_flags =
    ${common.board_flags}
  '-DRF_MODULE_FREQUENCY=433.92'   ; 433MHz ISM band
  '-DRF_RF69="RF69"'               ; RFM69 / RF69 family transceiver
  '-DOOK_FIXED_THRESHOLD=0x50'     ; OOK threshold for SX1231
; *** RF Module Pin Mapping for Freenove ESP32-S3-WROOM CAM carrier ***
; MISO/MOSI/SCK are SPI; DIO2 is the continuous-data output the decoder reads.
; DIO0 and DIO1 are not used by rtl_433_ESP for RF69; pass RADIOLIB_NC so
; RadioLib does not touch those pins.
  '-DRF_MODULE_MISO=1'               ; SPI MISO
  '-DRF_MODULE_MOSI=42'              ; SPI MOSI
  '-DRF_MODULE_SCK=41'               ; SPI SCK
  '-DRF_MODULE_CS=39'                ; SX1231 NSS/CS
  '-DRF_MODULE_RST=38'               ; RFM69 RESET pin
  '-DRF_MODULE_DIO0=RADIOLIB_NC'     ; unused for RF69 continuous-data mode
  '-DRF_MODULE_DIO1=RADIOLIB_NC'     ; unused for RF69 continuous-data mode
  '-DRF_MODULE_DIO2=40'              ; SX1231 DIO2 (continuous data output)
  '-DRF_MODULE_INIT_STATUS=true'

; The 915 MHz board: a second ESP32-S3 carrying an SX1276-family module
; (RegVersion 0x12) rather than the 433 board's SX1231. Its map was recovered
; with receiver/probe: the SPI bus is the same three pins, NSS is GPIO 40, and
; DIO2 is GPIO 38. RESET, DIO0 and DIO1 are not wired -- a sweep of every free
; GPIO found nothing that resets the part and nothing but DIO2 that moves -- so
; they are RADIOLIB_NC and the radio comes up without a reset pulse.
[env:sx1276-915]
platform = ${esp32s3.platform}
platform_packages = ${esp32s3.platform_packages}
board = ${esp32s3.board}
framework = ${esp32s3.framework}
board_build.partitions = ${esp32s3.board_build.partitions}
extra_scripts = ${esp32s3.extra_scripts}

build_flags =
    ${common.board_flags}
  '-DRF_MODULE_FREQUENCY=915.00'   ; 915MHz ISM band
  '-DRF_SX1276="SX1276"'           ; SX1276/77/78/79 family transceiver
; RegOokFix means different things on the two parts. On an SX127x it is the
; peak-mode floor in dB, where the SX1231's 0x50 leaves the part deaf;
; RadioLib's own default is 0x0C.
  '-DOOK_FIXED_THRESHOLD=0x0C'
  '-DRF_MODULE_MISO=1'               ; SPI MISO
  '-DRF_MODULE_MOSI=42'              ; SPI MOSI
  '-DRF_MODULE_SCK=41'               ; SPI SCK
  '-DRF_MODULE_CS=40'                ; SX1276 NSS/CS
  '-DRF_MODULE_RST=RADIOLIB_NC'      ; not wired on this board
  '-DRF_MODULE_DIO0=RADIOLIB_NC'     ; not wired on this board
  '-DRF_MODULE_DIO1=RADIOLIB_NC'     ; not wired on this board
  '-DRF_MODULE_DIO2=38'              ; SX1276 DIO2 (continuous data output)
  '-DRF_MODULE_INIT_STATUS=true'

; test/host/run.sh's last step builds the real firmware with FAKE_SIGNALS on,
; so a selfTest() using host-shim-only APIs (see af16f45's regression note
; there) still gets compiled for the target once. That build must never be
; what tools/flash-ota.js or an OTA push ships: FAKE_SIGNALS injects a
; synthetic decode every 3s, runs eight destructive NVS selfTests at boot,
; and switches logging to CDC Serial. A separate environment gives it its
; own build directory (.pio/build/rfm69-433-fakesignals/), so it can
; never overwrite rfm69-433's firmware.bin/firmware.elf — and, having
; no post:tools/save_elf.py, it never lands in tools/elf/ for
; fetch_coredump.sh to pick up either.
[env:rfm69-433-fakesignals]
extends = env:rfm69-433
extra_scripts = pre:load_env.py
                pre:build_dashboard.py
build_flags =
    ${env:rfm69-433.build_flags}
    -D FAKE_SIGNALS=true
